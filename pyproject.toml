[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multidot-controller"
version = "0.1.0"
description = "Small, durable, provided-materials-only multi-Dot controller"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
multidot = "multidot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
